bind_addr = "0.0.0.0:3000"
jd_root   = "./jd"

# --- Tasks ---
# Each [[tasks]] entry is one "situation" the model layer can be attuned to.
# InferenceClient::run(name, payload, context) looks a task up by `name`,
# so a model chain (e.g. lint -> sanitize -> classify) is just calling run()
# once per row below, in whatever order you want, feeding one output into
# the next call's input/context. Swapping backends (LocalAI -> Ollama ->
# llama.cpp directly, or adding a whisper.cpp server) is only ever a change
# to base_url/model here, never to inference.rs.

[[tasks]]
name          = "classify"
base_url      = "http://localhost:8090"   # LocalAI on Island
model         = "qwen_qwen3.5-0.8b"
temperature   = 0.1
kind          = "chat"
max_input_chars = 500
system_prompt = """
You are a routing assistant for a personal knowledge system organised by \
Johnny Decimal addresses. Given a piece of data, return only the most \
appropriate JD address (e.g. '34.2'). No explanation. No punctuation. \
Just the address.
"""

[[tasks]]
name          = "summarise"
base_url      = "http://localhost:8090"
model         = "qwen_qwen3.5-0.8b"
temperature   = 0.3
kind          = "chat"
system_prompt = """
You are a summarisation assistant for a personal knowledge system. \
Summarise the following content concisely. Context about where this will \
be stored: {context}
"""

[[tasks]]
name          = "chat"
base_url      = "http://localhost:8090"
model         = "qwen_qwen3.5-0.8b"
temperature   = 0.7
kind          = "chat"
system_prompt = """
You are a helpful assistant integrated into a personal knowledge system \
organised by Johnny Decimal addresses. {context}
"""

[[tasks]]
name          = "transcribe"
base_url      = "http://localhost:8091"   # whisper.cpp server, separate from LocalAI
model         = "whisper-base-en"
kind          = "audio"
system_prompt = "{context}"               # used as Whisper's vocabulary/style hint

