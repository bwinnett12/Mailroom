[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
leptos_router = { version = "0.6" }
wasm-bindgen = "0.2"
reqwest = { version = "0.11", features = ["json"] }
common = { workspace = true }
frontend = { path = "." }
serde = { workspace = true }
chrono = { workspace = true }
console_log = "1.0"
console_error_panic_hook = "0.1"
log = "0.4"


[[bin]]
name = "frontend"
path = "src/main.rs"